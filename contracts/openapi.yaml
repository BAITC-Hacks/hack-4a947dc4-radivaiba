openapi: 3.0.3
info:
  title: Career Quest API
  version: 2.0.0
  description: Local demo. Session cookies enforce employee/HR access. Demo business date defaults to the dataset; HR approval alone awards progress and EXP. Accept-Language selects ru/kk/en.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Dataset loaded and PostgreSQL reachable
          content:
            application/json:
              schema:
                type: object
                required: [status, as_of_date, revision]
                properties:
                  status: { type: string, enum: [ok] }
                  storage: { type: string, enum: [postgresql] }
                  build_version: { type: string }
                  business_date: { type: string, format: date }
                  as_of_date: { type: string, format: date }
                  revision: { type: integer }
        '503': { $ref: '#/components/responses/Error' }
  /session:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              additionalProperties: false
              properties:
                login:
                  { type: string, description: Individual account login (employee ID or HR login) }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session created; HttpOnly SameSite=Strict cookie, 8 hours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    get:
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      responses:
        '204': { description: Cookie and session removed }
  /employees:
    get:
      description: HR only
      responses:
        '200':
          description: Employee directory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EmployeeSummary' }
        '403': { $ref: '#/components/responses/Error' }
  /employees/{id}:
    parameters:
      - { $ref: '#/components/parameters/EmployeeID' }
    get:
      description: Own profile or any profile for HR
      responses:
        '200':
          description: Profile with effective skills and trajectory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /employees/{id}/recommendations:
    parameters:
      - { $ref: '#/components/parameters/EmployeeID' }
    get:
      description: Up to three validated recommendations. LLM timeout is at most 8 seconds; fallback is explicit. No candidates is a successful empty response.
      responses:
        '200':
          description: Recommendation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationResult' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /employees/{id}/completions:
    parameters:
      - { $ref: '#/components/parameters/EmployeeID' }
    post:
      deprecated: true
      description: Self-completion is disabled. Submit evidence and wait for HR approval.
      responses:
        '410': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /hr/overview:
    get:
      description: HR only; computed without LLM calls
      responses:
        '200':
          description: Aggregated target skill gaps and participation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '403': { $ref: '#/components/responses/Error' }
  /hr/import:
    post:
      description: HR only. At least one file, max 12 MiB request. Employees envelope matches starter kit, same as_of_date. Upsert by employee_id and record_id. Atomic validation of the merged dataset. Application-owned record IDs and DEMO_ prefixes are reserved. Imports do not issue account credentials or EXP.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                employees: { type: string, format: binary, description: employees.json }
                history: { type: string, format: binary, description: activity_history.csv }
      responses:
        '200':
          description: Import committed
          content:
            application/json:
              schema:
                type: object
                required:
                  [employees_added, employees_updated, history_added, history_updated, revision]
                properties:
                  employees_added: { type: integer }
                  employees_updated: { type: integer }
                  history_added: { type: integer }
                  history_updated: { type: integer }
                  revision: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /catalog/goals:
    {
      'get':
        {
          'description': 'Allowed role/grade pairs. Authenticated.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'properties':
                                {
                                  'items':
                                    {
                                      'type': 'array',
                                      'items': { '$ref': '#/components/schemas/Goal' },
                                    },
                                },
                              'required': ['items'],
                            },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
        },
    }
  /me/preferences:
    {
      'patch':
        {
          'description': 'Persist the current account language. Role and employee binding cannot be changed here.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json': { 'schema': { '$ref': '#/components/schemas/Session' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'properties':
                            { 'locale': { 'type': 'string', 'enum': ['ru', 'kk', 'en'] } },
                          'required': ['locale'],
                        },
                    },
                },
            },
        },
    }
  /employees/{id}/goal:
    {
      'patch':
        {
          'description': 'Owner or HR. Explicit null restores inferred next-grade goal; existing work and EXP are preserved.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json': { 'schema': { '$ref': '#/components/schemas/Profile' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'properties':
                            {
                              'goal':
                                {
                                  'nullable': true,
                                  'allOf': [{ '$ref': '#/components/schemas/Goal' }],
                                },
                            },
                          'required': ['goal'],
                        },
                    },
                },
            },
        },
    }
  /employees/{id}/development:
    {
      'get':
        {
          'description': 'Owner or HR. Tree modules, server-computed states, expected gains, experience and business date.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/Development' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
        },
    }
  /employees/{id}/modules/{event_id}/start:
    {
      'post':
        {
          'description': 'Profile owner starts an eligible module; freezes criteria/reward. Repeat calls reuse the occurrence.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/EnrollmentDetail' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [
              { 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } },
              {
                'name': 'event_id',
                'in': 'path',
                'required': true,
                'schema': { 'type': 'string' },
              },
            ],
        },
    }
  /enrollments/{id}:
    {
      'get':
        {
          'description': 'Owner or HR. Immutable submitted versions and review history; no private storage paths.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/EnrollmentDetail' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
        },
    }
  /enrollments/{id}/submissions:
    {
      'post':
        {
          'description': 'Owner only. Result text, HTTP(S) URL and/or up to 3 PDF/PNG/JPEG files of 5 MiB each. Request max 16 MiB; request_key makes retries idempotent. A text-only result needs at least 10 characters.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/SubmissionDetail' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'properties':
                            {
                              'text': { 'type': 'string', 'maxLength': 12000 },
                              'url': { 'type': 'string', 'maxLength': 2048 },
                              'request_key': { 'type': 'string', 'minLength': 8, 'maxLength': 100 },
                            },
                          'required': ['request_key'],
                        },
                    },
                  'multipart/form-data':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'properties':
                            {
                              'text': { 'type': 'string', 'maxLength': 12000 },
                              'url': { 'type': 'string', 'maxLength': 2048 },
                              'request_key': { 'type': 'string', 'minLength': 8, 'maxLength': 100 },
                              'files':
                                {
                                  'type': 'array',
                                  'maxItems': 3,
                                  'items': { 'type': 'string', 'format': 'binary' },
                                },
                            },
                          'required': ['request_key'],
                        },
                    },
                },
            },
        },
    }
  /hr/submissions:
    {
      'get':
        {
          'description': 'HR only. Review queue; pending_count is the total pending count before filtering.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'properties':
                                {
                                  'items':
                                    {
                                      'type': 'array',
                                      'items': { '$ref': '#/components/schemas/SubmissionDetail' },
                                    },
                                  'pending_count': { 'type': 'integer' },
                                },
                              'required': ['items', 'pending_count'],
                            },
                        },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [
              {
                'name': 'status',
                'in': 'query',
                'required': false,
                'schema':
                  {
                    'type': 'string',
                    'enum': ['pending', 'changes_requested', 'completed', 'revoked'],
                  },
              },
              {
                'name': 'employee_id',
                'in': 'query',
                'required': false,
                'schema': { 'type': 'string' },
              },
              {
                'name': 'event_id',
                'in': 'query',
                'required': false,
                'schema': { 'type': 'string' },
              },
              {
                'name': 'from',
                'in': 'query',
                'required': false,
                'schema': { 'type': 'string', 'format': 'date' },
              },
              {
                'name': 'to',
                'in': 'query',
                'required': false,
                'schema': { 'type': 'string', 'format': 'date' },
              },
            ],
        },
    }
  /hr/submissions/{id}/decision:
    {
      'post':
        {
          'description': 'HR only; self-review forbidden. Pending version is represented by immutable submission ID. Decision, completion, EXP and revision commit atomically. Return needs nonblank comment.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/SubmissionDetail' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'properties':
                            {
                              'action': { 'type': 'string', 'enum': ['approve', 'return'] },
                              'comment': { 'type': 'string', 'maxLength': 4000 },
                              'request_key': { 'type': 'string', 'minLength': 8, 'maxLength': 100 },
                            },
                          'required': ['action', 'request_key'],
                        },
                    },
                },
            },
        },
    }
  /hr/approvals/{id}/revoke:
    {
      'post':
        {
          'description': 'HR only. Adds reversal audit and original-month EXP correction without deleting history.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/SubmissionDetail' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'properties':
                            {
                              'comment': { 'type': 'string', 'minLength': 1, 'maxLength': 4000 },
                              'request_key': { 'type': 'string', 'minLength': 8, 'maxLength': 100 },
                            },
                          'required': ['comment', 'request_key'],
                        },
                    },
                },
            },
        },
    }
  /employees/{id}/experience:
    {
      'get':
        {
          'description': 'Owner or HR. Selected month defaults to business date; total EXP and tree never reset monthly.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/Experience' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [
              { 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } },
              {
                'name': 'month',
                'in': 'query',
                'required': false,
                'schema': { 'type': 'string', 'pattern': '^[0-9]{4}-[0-9]{2}$' },
              },
            ],
        },
    }
  /leaderboard:
    {
      'get':
        {
          'description': 'Authenticated. Employee output includes only full_name/rank/exp. HR output adds employee_id/department/role and supports filters. Equal EXP shares rank; zero EXP is omitted.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/Leaderboard' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [
              {
                'name': 'month',
                'in': 'query',
                'required': false,
                'schema': { 'type': 'string', 'pattern': '^[0-9]{4}-[0-9]{2}$' },
              },
              {
                'name': 'department',
                'in': 'query',
                'required': false,
                'schema': { 'type': 'string' },
              },
              { 'name': 'role', 'in': 'query', 'required': false, 'schema': { 'type': 'string' } },
            ],
        },
    }
  /employees/{id}/assistant:
    {
      'post':
        {
          'description': 'Owner or HR. Motivational support, no completion or EXP; proofs and employee names are not sent to LLM.',
          'responses':
            {
              '200':
                {
                  'description': 'Successful result',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/AssistantResponse' } },
                    },
                },
              '400': { '$ref': '#/components/responses/Error' },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
              '409': { '$ref': '#/components/responses/Error' },
            },
          'parameters':
            [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/AssistantRequest' } },
                },
            },
        },
    }
  /attachments/{id}:
    {
      'get':
        {
          'description': 'Owner or HR only. Private PDF/PNG/JPEG download; Content-Disposition attachment and nosniff.',
          'parameters':
            [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
          'responses':
            {
              '200':
                {
                  'description': 'Attachment bytes',
                  'content':
                    {
                      'application/octet-stream':
                        { 'schema': { 'type': 'string', 'format': 'binary' } },
                    },
                },
              '401': { '$ref': '#/components/responses/Error' },
              '403': { '$ref': '#/components/responses/Error' },
              '404': { '$ref': '#/components/responses/Error' },
            },
        },
    }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: careerquest_session
  parameters:
    EmployeeID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error; no partial mutations
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    Session:
      type: object
      required: [account_id, login, locale, role, employee_id]
      properties:
        account_id: { type: string }
        login: { type: string }
        locale: { type: string, enum: [ru, kk, en] }
        role: { type: string, enum: [employee, hr] }
        employee_id:
          { type: string, description: Bound profile ID; HR may have no employee binding }
    Goal:
      type: object
      required: [target_role, target_grade]
      properties:
        target_role: { type: string }
        target_grade: { type: string, enum: [Junior, Middle, Senior, Lead] }
    EmployeeSummary:
      type: object
      required: [employee_id, full_name, department, role, grade]
      properties:
        employee_id: { type: string }
        full_name: { type: string }
        department: { type: string }
        role: { type: string }
        grade: { type: string, enum: [Junior, Middle, Senior, Lead] }
    Employee:
      allOf:
        - { $ref: '#/components/schemas/EmployeeSummary' }
        - type: object
          required:
            [
              manager_id,
              hire_date,
              tenure_months,
              work_format,
              preferred_language,
              career_goal,
              skills,
              last_review_date,
            ]
          properties:
            manager_id: { type: string, nullable: true }
            hire_date: { type: string, format: date }
            tenure_months: { type: integer }
            work_format: { type: string, enum: [office, hybrid, remote] }
            preferred_language: { type: string, enum: [kk, ru, en] }
            career_goal:
              nullable: true
              allOf:
                - { $ref: '#/components/schemas/Goal' }
            skills:
              type: object
              additionalProperties: { type: integer, minimum: 0, maximum: 5 }
            last_review_date: { type: string, format: date }
    SkillProgress:
      type: object
      required: [skill_id, name, type, current, required, gap, critical]
      properties:
        skill_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [hard, soft] }
        current: { type: integer, minimum: 0, maximum: 5 }
        required: { type: integer, minimum: 0, maximum: 5 }
        gap: { type: integer }
        critical: { type: boolean }
    Trajectory:
      type: object
      required: [goal, inferred, at_top_grade, progress, critical_gaps, skills]
      properties:
        goal: { $ref: '#/components/schemas/Goal' }
        inferred: { type: boolean }
        at_top_grade: { type: boolean }
        progress: { type: number, minimum: 0, maximum: 100 }
        critical_gaps: { type: integer }
        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillProgress' }
    HistoryItem:
      type: object
      required:
        [
          record_id,
          employee_id,
          event_id,
          event_title,
          date,
          due_date,
          status,
          completion_pct,
          score,
          feedback_rating,
          assigned_by,
        ]
      properties:
        record_id: { type: string }
        employee_id: { type: string }
        event_id: { type: string }
        event_title: { type: string }
        date: { type: string, format: date }
        due_date: { type: string, description: Empty when absent }
        status:
          { type: string, enum: [completed, in_progress, dropped, no_show, declined, overdue] }
        completion_pct: { type: integer, minimum: 0, maximum: 100 }
        score: { type: integer, nullable: true }
        feedback_rating: { type: integer, nullable: true }
        assigned_by: { type: string, enum: [self, manager, hr] }
        demo: { type: boolean }
    Profile:
      type: object
      required: [employee, effective_skills, trajectory, history, as_of_date, revision]
      properties:
        employee: { $ref: '#/components/schemas/Employee' }
        effective_skills:
          type: object
          additionalProperties: { type: integer }
        trajectory: { $ref: '#/components/schemas/Trajectory' }
        history:
          type: array
          items: { $ref: '#/components/schemas/HistoryItem' }
        as_of_date: { type: string, format: date }
        revision: { type: integer }
    Event:
      type: object
      required:
        [
          event_id,
          title,
          description,
          description,
          type,
          format,
          duration_hours,
          mandatory,
          target_roles,
          target_grades,
          develops_skills,
          prerequisites,
          upcoming_sessions,
        ]
      properties:
        event_id: { type: string }
        title: { type: string }
        description: { type: string }
        description: { type: string }
        type: { type: string }
        format: { type: string, enum: [online, offline, self_paced] }
        duration_hours: { type: number }
        mandatory: { type: boolean }
        target_roles: { type: array, items: { type: string } }
        target_grades: { type: array, items: { type: string } }
        develops_skills:
          type: array
          items:
            type: object
            properties:
              skill_id: { type: string }
              gain: { type: integer }
              max_level: { type: integer }
        prerequisites: { type: object, additionalProperties: { type: integer } }
        upcoming_sessions: { type: array, items: { type: string, format: date } }
    Recommendation:
      type: object
      required: [event, score, expected_gains, evidence, explanation, cross_role, in_progress]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        score: { type: number }
        expected_gains:
          type: array
          items:
            type: object
            required: [skill_id, name, before, after, required]
            properties:
              skill_id: { type: string }
              name: { type: string }
              before: { type: integer }
              after: { type: integer }
              required: { type: integer }
        evidence:
          type: array
          items:
            type: object
            required: [id, factor, text]
            properties:
              id: { type: string }
              factor: { type: string, enum: [goal, gap, history] }
              text: { type: string }
        explanation: { type: string }
        cross_role: { type: boolean }
        in_progress: { type: boolean }
